# CardVault - Release: portable executable + installer
# Copyright (c) 2026 Gabriel Dobre. All rights reserved.
#
# Runs when you publish a GitHub Release (tag like v1.3.0).
# Builds and attaches to the Release:
#   - CardVault-<version>-win-x64-portable.zip   (runs without installation)
#   - CardVault-Setup-<version>.exe              (installer; adds Windows Firewall
#                                                 rules that block all traffic)
# The Microsoft Store package is built in parallel by store.yml.
#
# Signing (optional): if the CODE_SIGN_PFX_BASE64 + CODE_SIGN_PASSWORD secrets
# exist, the files are signed; otherwise they stay unsigned (Windows shows a warning).
#
# x86 (32-bit) is not possible: PySide6 (Qt for Python) exists only for 64-bit.

name: Release - portable + installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3.0). Empty = taken from the tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determine version
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          V="${V#v}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Invalid version: '$V'. Publish a Release with a tag like v1.3.0." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build CardVault.exe (x64)
        shell: pwsh
        run: ./tools/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist/CardVault" -DestinationPath "CardVault-$v-win-x64-portable.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Attach to the Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CardVault-${{ steps.ver.outputs.version }}-win-x64-portable.zip
            installer/*.exe

      - name: Upload artifacts (manual run)
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: CardVault-${{ steps.ver.outputs.version }}-portable
          path: |
            CardVault-${{ steps.ver.outputs.version }}-win-x64-portable.zip
            installer/*.exe
