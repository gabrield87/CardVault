# CardVault - Release: executabil portabil + installer
# Copyright (c) 2026 Gabriel Dobre. All rights reserved.
#
# Se declanșează când publici un Release pe GitHub (tag de forma v1.3.0).
# Produce și atașează la Release:
#   - CardVault-<versiune>-win-x64-portable.zip   (rulează fără instalare)
#   - CardVault-Setup-<versiune>.exe              (installer; adaugă reguli Windows
#                                                  Firewall care blochează orice trafic)
# Versiunea pentru Microsoft Store se construiește în paralel de store.yml.
#
# Semnare (opțională): dacă există Secrets CODE_SIGN_PFX_BASE64 + CODE_SIGN_PASSWORD,
# fișierele se semnează; altfel rămân nesemnate (Windows afișează avertismentul).
#
# x86 (32 de biți) nu este posibil: PySide6 (Qt for Python) există doar pe 64 de biți.

name: Release – portabil + installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versiunea (ex. 1.3.0). Gol = din tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determină versiunea
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          V="${V#v}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Versiune invalidă: '$V'. Publică un Release cu tag de forma v1.3.0." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build CardVault.exe (x64)
        shell: pwsh
        run: ./tools/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Semnează CardVault.exe (dacă există certificat)
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: ./tools/sign.ps1 "dist/CardVault/CardVault.exe"

      - name: Zip portabil
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist/CardVault" -DestinationPath "CardVault-$v-win-x64-portable.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a eșuat" }

      - name: Semnează installer-ul (dacă există certificat)
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: Get-ChildItem "installer/*.exe" | ForEach-Object { ./tools/sign.ps1 $_.FullName }

      - name: Atașează la Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CardVault-${{ steps.ver.outputs.version }}-win-x64-portable.zip
            installer/*.exe

      - name: Artefacte (rulare manuală)
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: CardVault-${{ steps.ver.outputs.version }}-portable
          path: |
            CardVault-${{ steps.ver.outputs.version }}-win-x64-portable.zip
            installer/*.exe
