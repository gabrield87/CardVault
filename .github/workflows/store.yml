# CardVault - Release: pachet MSIX pentru Microsoft Store
# Copyright (c) 2026 Gabriel Dobre. All rights reserved.
#
# Rulează în paralel cu release.yml, la același Release. Produce:
#   - CardVault-<versiune>-store-x64.msix  -> îl urci în Partner Center
# Microsoft Store semnează pachetul la publicare, deci utilizatorii care
# instalează din Store NU văd avertismentul SmartScreen.
#
# Configurare (o singură dată), după ce rezervi numele aplicației în Partner Center:
#   repo → Settings → Secrets and variables → Actions → tab „Variables” → New variable
#     STORE_IDENTITY_NAME           = Package/Identity/Name
#     STORE_PUBLISHER               = Package/Identity/Publisher   (ex. CN=1A2B3C4D-....)
#     STORE_PUBLISHER_DISPLAY_NAME  = Package/Properties/PublisherDisplayName
# Până le setezi, workflow-ul doar explică ce lipsește și nu eșuează Release-ul.

name: Release – Microsoft Store (MSIX)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versiunea (ex. 1.3.0). Gol = din tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  msix:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Verifică identitatea din Partner Center
        id: cfg
        shell: bash
        run: |
          if [ -z "$STORE_IDENTITY_NAME" ] || [ -z "$STORE_PUBLISHER" ] || [ -z "$STORE_PUBLISHER_DISPLAY_NAME" ]; then
            {
              echo "### Pachetul pentru Microsoft Store nu a fost construit"
              echo "Lipsesc variabilele repo-ului: STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_DISPLAY_NAME."
              echo "Le găsești în Partner Center → aplicația → Product management → Product identity,"
              echo "apoi le adaugi în Settings → Secrets and variables → Actions → Variables."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determină versiunea
        if: steps.cfg.outputs.ready == 'true'
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          V="${V#v}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Versiune invalidă: '$V'. Publică un Release cu tag de forma v1.3.0." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build CardVault.exe (x64)
        if: steps.cfg.outputs.ready == 'true'
        shell: pwsh
        run: ./tools/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Pregătește conținutul MSIX
        if: steps.cfg.outputs.ready == 'true'
        shell: pwsh
        run: >
          python tools/make_msix.py
          --version "${{ steps.ver.outputs.version }}"
          --identity "$env:STORE_IDENTITY_NAME"
          --publisher "$env:STORE_PUBLISHER"
          --publisher-name "$env:STORE_PUBLISHER_DISPLAY_NAME"
          --src dist/CardVault --out build/msix

      - name: Creează pachetul MSIX
        if: steps.cfg.outputs.ready == 'true'
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/makeappx.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe nu a fost găsit" }
          $out = "CardVault-${{ steps.ver.outputs.version }}-store-x64.msix"
          & $makeappx.FullName pack /d build/msix /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx a eșuat" }

      - name: Atașează la Release
        if: steps.cfg.outputs.ready == 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: CardVault-${{ steps.ver.outputs.version }}-store-x64.msix

      - name: Artefact (rulare manuală)
        if: steps.cfg.outputs.ready == 'true' && github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CardVault-${{ steps.ver.outputs.version }}-store
          path: CardVault-${{ steps.ver.outputs.version }}-store-x64.msix
